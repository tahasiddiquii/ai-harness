[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-harness"
version = "0.1.0"
description = "A production AI harness — the decision layer that turns a raw LLM into a reliable, observable agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Taha Siddiqui", email = "work.tahasiddiqui@gmail.com" }]
keywords = [
  "llm", "agents", "agent-harness", "harness-engineering", "rag",
  "langgraph", "langfuse", "observability", "guardrails", "llmops",
  "model-routing", "llm-as-a-judge",
]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "langgraph>=1.0",
  "langfuse>=3.0",
  "rank-bm25>=0.2.2",
  "tenacity>=8.3",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
redis = ["redis>=5.0"]
vector = ["qdrant-client>=1.9"]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
ai-harness = "ai_harness.cli:main"

[project.urls]
Homepage = "https://github.com/tahasiddiquii/ai-harness"
Source = "https://github.com/tahasiddiquii/ai-harness"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008", "UP042"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
