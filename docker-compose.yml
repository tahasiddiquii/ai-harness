# Optional local stack. The harness runs fine with NO Docker at all — this is here
# to show the LLMOps wiring. Langfuse Cloud (cloud.langfuse.com) is the default
# observability backend; uncomment / use `--profile observability` to self-host.
#
#   docker compose up app                          # just the API (uses cloud Langfuse if keys set)
#   docker compose --profile observability up       # API + self-hosted Langfuse + Postgres
#   docker compose --profile stores up              # API + Redis (memory) + Qdrant (vectors)

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    restart: unless-stopped

  # --- Self-hosted observability (optional) ------------------------------- #
  langfuse:
    image: langfuse/langfuse:2
    profiles: ["observability"]
    depends_on:
      - langfuse-db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-prod
      SALT: change-me-in-prod
      TELEMETRY_ENABLED: "false"
    restart: unless-stopped

  langfuse-db:
    image: postgres:16-alpine
    profiles: ["observability"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  # --- Optional context stores -------------------------------------------- #
  redis:
    image: redis:7-alpine
    profiles: ["stores"]
    ports:
      - "6379:6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["stores"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  langfuse-db-data:
  qdrant-data:
